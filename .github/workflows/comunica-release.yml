#
# Builds the Talk installers for macOS, Windows and Linux
# and publishes them as a GitHub release.
#
# Run it by pushing a tag: git tag v2.3.2 && git push github v2.3.2
# Or from the Actions tab, which produces the files without a release.

name: Talk release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}

jobs:
  build:
    strategy:
      # One platform failing should not throw away the others
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            # appdmg uses util.isDate, removed in Node 23, so the DMG needs an older Node
            node: 22
            build: npm run build:mac:arm64
            package: npm run package:mac:arm64
          - os: windows-latest
            name: Windows
            node: 24
            build: npm run build:windows:x64
            # Only the one-click installer: the MSI needs the WiX toolset
            package: npm run package:windows:x64:exe
          - os: ubuntu-latest
            name: Linux
            node: 24
            build: npm run build:linux
            # Only the archive: the Flatpak needs a runtime that the runner lacks
            package: npx electron-forge make --skip-package --platform=linux --targets=@electron-forge/maker-zip

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The lock file needs npm 11, which Node 22 does not ship with
      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Fetch Nextcloud Talk and finish the setup
        run: npm run setup

      - name: Build the application
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.build }}

      # With a Developer ID the app is signed and notarised by electron-forge
      # itself, see osxSign and osxNotarize in forge.config.js. The certificate
      # lives in a keychain created for this run only.
      - name: Load the signing certificate
        if: matrix.os == 'macos-latest' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Without a Developer ID, a local signature at least avoids the
      # "app is damaged" message that Apple Silicon shows for unsigned binaries
      - name: Sign the app locally
        if: matrix.os == 'macos-latest' && env.MACOS_CERTIFICATE == ''
        run: codesign --force --deep --sign - "out/Talk-darwin-arm64/Talk.app"

      - name: Create the installers
        run: ${{ matrix.package }}

      # Files written by an installer package do not carry the quarantine flag,
      # so the app opens without clearing it by hand. The package itself is
      # unsigned, so macOS still asks once before running it.
      - name: Build an installer package for macOS
        if: matrix.os == 'macos-latest'
        run: |
          productbuild \
            --component "out/Talk-darwin-arm64/Talk.app" /Applications \
            "out/make/Talk-macos-arm64.pkg"

      - name: Collect the installers
        uses: actions/upload-artifact@v4
        with:
          name: comunica-${{ matrix.name }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.pkg
            out/make/**/*.exe
            out/make/**/*.msi
            out/make/**/*.flatpak
            out/make/**/*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    # Publishes whatever built, instead of losing two platforms because of one
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Collect every platform
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          generate_release_notes: true
